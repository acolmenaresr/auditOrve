default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database: auditOrve_development

  audit:
    <<: *default
    host: <%= ENV.fetch("AUDIT_DB_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("AUDIT_DB_PORT", 5432) %>
    username: <%= ENV.fetch("AUDIT_DB_USERNAME", "dev_master") %>
    password: <%= ENV["AUDIT_DB_PASSWORD"].to_s.inspect %>
    database: <%= ENV.fetch("AUDIT_DATABASE_NAME", "auditdb_local") %>
    database_tasks: false
    schema_dump: false


test:
  primary:
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV.fetch("DB_USERNAME", "dev_master") %>
    password: <%= ENV["DB_PASSWORD"] %>
    database: <%= ENV.fetch("TEST_DATABASE_NAME", "audit_orve_test") %>

  audit:
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV.fetch("DB_USERNAME", "dev_master") %>
    password: <%= ENV["DB_PASSWORD"] %>
    database: <%= ENV.fetch("AUDIT_TEST_DATABASE", "auditdb_local") %>
    database_tasks: false
    schema_dump: false


production:
  primary: &primary_production
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    database: <%= ENV.fetch("PRIMARY_DATABASE_NAME", "audit_orve_production") %>

  cache:
    <<: *primary_production
    database: <%= ENV.fetch("CACHE_DATABASE_NAME", "audit_orve_production_cache") %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: <%= ENV.fetch("QUEUE_DATABASE_NAME", "audit_orve_production_queue") %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: <%= ENV.fetch("CABLE_DATABASE_NAME", "audit_orve_production_cable") %>
    migrations_paths: db/cable_migrate

  audit:
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    port: <%= ENV.fetch("DB_PORT", 5432) %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    database: <%= ENV.fetch("AUDIT_DATABASE_NAME", "auditpr-2026") %>
    database_tasks: false
    schema_dump: false